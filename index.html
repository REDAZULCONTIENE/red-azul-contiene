<!-- JAVASCRIPT DE INTERACTIVIDAD -->
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // Respiración guiada
        let breathInterval = null;
        function toggleBreath() {
            const btn = document.getElementById('btn-start-breath');
            const circle = document.getElementById('breath-circle');
            const text = document.getElementById('breath-text');
            const phase = document.getElementById('breath-phase');

            if (breathInterval) {
                clearInterval(breathInterval);
                breathInterval = null;
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Iniciar Guía';
                circle.classList.remove('pulse-breath');
                text.innerText = 'Preparado';
                phase.innerText = 'Presioná iniciar cuando estés listo/a.';
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-stop"></i> Detener';
            circle.classList.add('pulse-breath');
            
            const runCycle = () => {
                text.innerText = 'Inhalá (4s)';
                phase.innerText = 'Tomá aire suavemente por la nariz...';
                
                setTimeout(() => {
                    if(!breathInterval) return;
                    text.innerText = 'Retené (2s)';
                    phase.innerText = 'Mantené el aire sin forzar...';
                }, 4000);

                setTimeout(() => {
                    if(!breathInterval) return;
                    text.innerText = 'Exhalá (6s)';
                    phase.innerText = 'Soltá el aire lentamente por la boca...';
                }, 6000);
            };

            runCycle();
            breathInterval = setInterval(runCycle, 12000);
        }

        // Checklist de Anclaje
        function toggleStep(element) {
            element.classList.toggle('bg-azul-50');
            element.classList.toggle('border-azul-400');
            const icon = element.querySelector('.check-icon');
            if (icon.classList.contains('fa-regular')) {
                icon.classList.remove('fa-regular', 'fa-circle-check', 'text-slate-300');
                icon.classList.add('fa-solid', 'fa-circle-check', 'text-azul-600');
            } else {
                icon.classList.remove('fa-solid', 'fa-circle-check', 'text-azul-600');
                icon.classList.add('fa-regular', 'fa-circle-check', 'text-slate-300');
            }
        }

        // Filtro de recursos
        function filterResources(category) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active', 'bg-azul-600', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            });
            event.target.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            event.target.classList.add('active', 'bg-azul-600', 'text-white');

            const cards = document.querySelectorAll('.resource-card');
            cards.forEach(card => {
                if (category === 'todos' || card.classList.contains(category)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Envío de formulario directo a tu WhatsApp (+54 9 2281 584644)
        function handleFormSubmit(event) {
            event.preventDefault();
            
            const inputs = event.target.querySelectorAll('input, select, textarea');
            const nombre = inputs[0].value;
            const telefono = inputs[1].value;
            const barrio = inputs[2].value;
            const motivo = inputs[3].value;
            const mensaje = inputs[4].value;

            const textoWhatsApp = `*Nueva Solicitud - Red Azul Contiene*%0A%0A` +
                `*Nombre:* ${nombre}%0A` +
                `*Teléfono:* ${telefono}%0A` +
                `*Barrio:* ${barrio}%0A` +
                `*Motivo:* ${motivo}%0A` +
                `*Mensaje:* ${mensaje}`;

            const url = `https://wa.me/5492281584644?text=${textoWhatsApp}`;
            window.open(url, '_blank');
        }
    </script>
